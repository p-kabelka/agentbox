# Shared base compose — do not edit per-project settings here.
# Per-session configuration lives in the generated session compose.yaml.

volumes:
  proxy-ca:    # mitmproxy CA cert shared between proxy and agent
  git-data:    # bare repositories and the agent's reference-repository catalog

networks:
  agent-net:
    internal: true   # no external forwarding; the guard restricts exact destinations
  proxy-net:         # internet-connected; only the proxy service is attached

services:

  proxy:
    image: localhost/agentbox-proxy:${AGENTBOX_IMAGE_TAG:-latest}
    runtime: crun
    networks:
      - agent-net
      - proxy-net
    # Populated only by agentbox start / proxy reload / proxy restart.
    tmpfs:
      - /run/secrets:rw,noexec,nosuid,nodev,mode=0700
    volumes:
      - proxy-ca:/root/.mitmproxy:z
      - /proc/1/net:/host-net:ro
    # environment:
    #   AGENTBOX_NAME: ${AGENTBOX_NAME:-}
    #   ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    #   OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    #   AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
    #   GOOGLE_APPLICATION_CREDENTIALS: /oauth/credentials.json
    #   GOOGLE_CLOUD_PROJECT: ${VERTEX_PROJECT_ID:-}
    #   VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
    #   VERTEX_REGION: ${VERTEX_REGION:-}
    # ports: defined per-project in compose.override.yaml
    restart: unless-stopped

  git:
    image: localhost/agentbox-git:${AGENTBOX_IMAGE_TAG:-latest}
    networks:
      - agent-net
    volumes:
      - git-data:/srv/git:z
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  network:
    image: localhost/agentbox-network:${AGENTBOX_IMAGE_TAG:-latest}
    runtime: crun
    # The namespace and firewall outlive the one-shot installer.
    entrypoint: ["/usr/bin/sleep", "infinity"]
    networks:
      - agent-net
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    stop_signal: SIGKILL  # The idle holder has no state to flush at session teardown.
    restart: "no"

  guard:
    image: localhost/agentbox-network:${AGENTBOX_IMAGE_TAG:-latest}
    runtime: crun
    # Each invocation joins the holder's current namespace, installs, and exits.
    network_mode: service:network
    depends_on:
      - network
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    read_only: true
    volumes:
      - ./network-config:/agentbox-network:ro,z
    security_opt:
      - no-new-privileges:true
    restart: "no"

  agent:
    image: localhost/agentbox-agent-base:${AGENTBOX_IMAGE_TAG:-latest}
    # The holder retains the firewall after the installer exits. The VM
    # cannot change it, even as guest root.
    network_mode: service:network
    cap_drop:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - proxy
      - git
      - network
    runtime: krun
    environment:
      AGENTBOX_NAME: ${AGENTBOX_NAME:-}

      # Dummy credentials — proxy injects real values via mitmproxy
      # ANTHROPIC_API_KEY: dummy
      # OPENAI_API_KEY: dummy
      # AZURE_OPENAI_API_KEY: dummy

      # Vertex: OAuth tokens served by fake GCE metadata server on proxy
      GCE_METADATA_HOST: proxy:9090
      # ANTHROPIC_VERTEX_PROJECT_ID: ${VERTEX_PROJECT_ID:-}
      # CLOUD_ML_REGION: ${VERTEX_REGION:-}

      HTTPS_PROXY: http://proxy:8080
      https_proxy: http://proxy:8080
      HTTP_PROXY: http://proxy:8080
      http_proxy: http://proxy:8080
      NO_PROXY: proxy,git,localhost,127.0.0.1
      no_proxy: proxy,git,localhost,127.0.0.1
      NODE_USE_ENV_PROXY: 1
    volumes:
      - proxy-ca:/proxy-ca:ro,z
      - ./network-config:/agentbox-network:ro,z
    stdin_open: true
    tty: true
    logging:
      driver: none
